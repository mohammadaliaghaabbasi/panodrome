<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Panodrome — Walk through Architecture</title>
<meta name="description" content="Panodrome — the spatial & living architecture collection. Truly walk through curated 360° interiors with real first-person physics, furniture collision and doorway portals.">
<meta name="theme-color" content="#070a10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e8eef7' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e8eef7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/gsap-3.12.5.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three-0.160.0.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="scene"></div>

  <!-- ============ Stage 1.5 · Invisible Luxury UI ============ -->

  <!-- top-inline-start: single compact glass pill (badge · title · designer · source) -->
  <div id="room-pill" class="glass hud-hidden">
    <h1 id="room-title"></h1>
    <div id="room-badge"></div>
    <div class="pill-meta">
      <span id="room-designer"></span>
      <a id="room-source" class="source-badge" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <!-- top-inline-end: circular glass buttons [📐 radar] [🔊] [EN/فا] [⛶/reset] -->
  <div id="view-actions" class="hud-hidden">
    <button id="btn-radar" class="glass round-btn" aria-label="">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><circle cx="17.5" cy="17.5" r="3.5"/></svg>
    </button>
    <button id="btn-sound" class="glass round-btn" aria-label="">
      <svg id="snd-on" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a8.6 8.6 0 0 1 0 12"/></svg>
      <svg id="snd-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
    </button>
    <button id="btn-lang" class="glass round-btn" aria-label="فا / EN">فا</button>
    <button id="btn-view" class="glass round-btn" aria-label="">
      <svg id="btn-view-full" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg id="btn-view-reset" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg>
    </button>
  </div>

  <!-- bottom-centre: routing-mode bar (user-driven exploration) -->
  <div id="mode-bar" class="glass hud-hidden" role="group" aria-label="Routing modes">
    <button id="mode-architect" class="mode-chip" data-mode="architect">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9.5 21v-6h5v6"/></svg>
      <span class="mode-label"></span>
    </button>
    <button id="mode-style" class="mode-chip" data-mode="style">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8"/></svg>
      <span class="mode-label"></span>
    </button>
    <button id="mode-room_type" class="mode-chip" data-mode="room_type">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9.5 21v-4h5v4"/></svg>
      <span class="mode-label"></span>
    </button>
    <button id="mode-random" class="mode-chip" data-mode="random">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/></svg>
      <span class="mode-label"></span>
    </button>
  </div>

  <!-- bottom-centre: floating glass capsule (prev · name (i of n) · next + hint) -->
  <div id="nav-capsule" class="glass hud-hidden">
    <button id="nav-prev" class="nav-btn" aria-label="">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 7.5 12l7 7"/></svg>
    </button>
    <div class="nav-center">
      <div class="nav-roomline"><span id="nav-name"></span><span id="nav-count"></span></div>
      <div id="nav-hint"></div>
    </div>
    <button id="nav-next" class="nav-btn" aria-label="">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- transient collision toast + radial ripple host -->
  <div id="bump-toast" class="glass hud-hidden"><span id="bump-label"></span></div>
  <div id="ripple-host"></div>

  <!-- touch only: analog walk joystick -->
  <div id="joystick" class="hud-hidden">
    <div id="joy-base" class="glass"><div id="joy-knob"></div></div>
  </div>

  <!-- doorway waypoint chip (hover / tap) -->
  <button id="wp-chip" class="glass hud-hidden"><span id="wp-chip-label"></span></button>

  <!-- live 2D floorplan radar (walls, doorway, furniture blocks, camera + view cone) -->
  <div id="radar-wrap" class="glass hud-hidden">
    <canvas id="radar"></canvas>
    <div id="radar-label"></div>
  </div>

  <!-- loading -->
  <div id="loading" class="overlay hud-hidden">
    <div class="load-word">PANODROME</div>
    <div class="load-bar"><div id="load-fill"></div></div>
    <div id="load-text"></div>
  </div>

  <!-- room warp crossfade -->
  <div id="fade"></div>

  <!-- intro -->
  <div id="intro" class="overlay">
    <div class="intro-bg" id="intro-bg"></div>
    <div class="intro-veil"></div>
    <div class="intro-inner">
      <div class="wordmark">PANO<span>DROME</span></div>
      <div class="tagline" id="intro-tag"></div>
      <div class="intro-sub" id="intro-sub"></div>
      <button id="btn-enter"><span></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="intro-hint" id="intro-hint"></div>
      <div class="intro-credit" id="intro-credit"></div>
    </div>
  </div>

  <div id="webgl-error" class="overlay hud-hidden"><p>WebGL is not available in this browser.</p></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
